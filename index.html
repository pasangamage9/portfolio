<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Camera Film Roll</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mint: {
                            400: '#98FF98',
                            500: '#80E8A7',
                            600: '#52C785',
                            glow: '#a8e6cf',
                        },
                        charcoal: {
                            900: '#121214',
                            800: '#18181A',
                            700: '#222226',
                            600: '#2D2D32',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121214;
            color: #e0e0e0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .vintage-font {
            font-family: 'Courier Prime', monospace;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(24, 24, 26, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #2d2d32;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(24, 24, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Custom range slider accent */
        input[type=range]::-webkit-slider-thumb {
            background: #98FF98;
            box-shadow: 0 0 10px rgba(152, 255, 152, 0.4);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between relative overflow-hidden bg-charcoal-900 text-neutral-200">

    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0 cursor-grab active:cursor-grabbing"></div>

    <!-- Top Navigation Header -->
    <header class="relative z-10 p-4 md:p-5 flex justify-between items-center glass-panel m-4 rounded-xl pointer-events-auto">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-mint-400/10 border border-mint-400/30 flex items-center justify-center text-mint-400">
                <i data-lucide="film" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 class="font-medium text-base md:text-lg tracking-tight text-white flex items-center gap-2">
                    MINIMAL 35mm <span class="text-[10px] px-2 py-0.5 rounded bg-mint-400/10 text-mint-400 border border-mint-400/20 vintage-font">ISO 400</span>
                </h1>
                <p class="text-xs text-neutral-400">Interactive Film Roll</p>
            </div>
        </div>

        <!-- Frame Stats & Quick Actions -->
        <div class="flex items-center gap-2 md:gap-4">
            <div class="hidden sm:flex flex-col items-end mr-2">
                <span class="text-[10px] tracking-wider text-neutral-400">UNROLLED</span>
                <span id="film-counter-display" class="vintage-font text-mint-400 text-xs font-bold">FRAME 01 / 12</span>
            </div>
            
            <button id="btn-upload-trigger" class="flex items-center gap-2 bg-neutral-100 hover:bg-mint-400 text-charcoal-900 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all shadow-sm active:scale-95">
                <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                <span class="hidden md:inline">Add Photos</span>
            </button>
            <input type="file" id="image-upload-input" accept="image/*" multiple class="hidden">

            <button id="btn-reset-view" title="Reset Camera View" class="p-2 rounded-lg bg-charcoal-700/60 hover:bg-charcoal-600 border border-neutral-800 text-neutral-300 transition-all active:scale-95">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            </button>
        </div>
    </header>

    <!-- Center Drag Hint Overlay -->
    <div id="drag-hint" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none transition-opacity duration-700 flex flex-col items-center gap-2 bg-charcoal-900/80 px-4 py-3 rounded-xl border border-neutral-800 backdrop-blur-md">
        <div class="w-8 h-8 rounded-full bg-mint-400/10 border border-mint-400/30 flex items-center justify-center text-mint-400 animate-pulse">
            <i data-lucide="move-horizontal" class="w-4 h-4"></i>
        </div>
        <p class="text-xs text-neutral-300 font-light">Scroll wheel or drag film strip to unroll</p>
    </div>

    <!-- Bottom Interactive Control Dock -->
    <div class="relative z-10 p-4 md:p-5 flex flex-col md:flex-row items-center justify-between gap-4 glass-panel m-4 rounded-xl pointer-events-auto">
        
        <!-- Pull / Rewind Slider Controls -->
        <div class="flex items-center gap-3 w-full md:w-1/3">
            <button id="btn-rewind-full" title="Rewind Entire Film" class="p-2 rounded-lg bg-charcoal-700/60 hover:bg-charcoal-600 border border-neutral-800 text-mint-400 transition-all active:scale-95">
                <i data-lucide="rewind" class="w-3.5 h-3.5"></i>
            </button>
            <div class="flex-1 flex flex-col gap-1">
                <div class="flex justify-between text-[10px] text-neutral-400 vintage-font">
                    <span>REWIND</span>
                    <span id="slider-percentage" class="text-mint-400">15%</span>
                    <span>UNROLL</span>
                </div>
                <input id="film-pull-slider" type="range" min="0" max="100" value="15" step="0.5" 
                       class="w-full h-1.5 bg-charcoal-700 rounded-lg appearance-none cursor-pointer">
            </div>
            <button id="btn-unroll-full" title="Unroll Film Fully" class="p-2 rounded-lg bg-charcoal-700/60 hover:bg-charcoal-600 border border-neutral-800 text-mint-400 transition-all active:scale-95">
                <i data-lucide="fast-forward" class="w-3.5 h-3.5"></i>
            </button>
        </div>

        <!-- Frame Selection Strip Quick Jump -->
        <div id="frame-thumbnails-container" class="flex items-center gap-2 overflow-x-auto max-w-full md:max-w-md py-1 px-2 border-x border-neutral-800">
            <!-- Thumbnails dynamically rendered via JS -->
        </div>

        <!-- Material and lighting toggle controls -->
        <div class="flex items-center gap-2">
            <button id="btn-toggle-transparent" class="px-3 py-1.5 rounded-lg bg-charcoal-700/60 hover:bg-charcoal-600 border border-neutral-800 text-xs text-neutral-300 flex items-center gap-2 transition-all">
                <i data-lucide="eye" class="w-3.5 h-3.5 text-mint-400"></i>
                <span id="transparent-label">Shell: Opaque</span>
            </button>
        </div>
    </div>

    <!-- Photo Zoom Inspection Modal -->
    <div id="photo-modal" class="fixed inset-0 z-50 bg-charcoal-900/90 backdrop-blur-xl flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="relative max-w-2xl w-full glass-panel p-6 rounded-2xl border border-neutral-800 shadow-2xl flex flex-col items-center">
            
            <button id="btn-close-modal" class="absolute top-4 right-4 p-2 rounded-lg bg-charcoal-700/60 hover:bg-charcoal-600 text-neutral-300 transition-all">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>

            <div class="w-full text-center mb-4">
                <span id="modal-frame-tag" class="vintage-font text-mint-400 text-[10px] tracking-widest uppercase bg-mint-400/10 px-3 py-1 rounded border border-mint-400/20">FRAME #01</span>
                <h3 id="modal-frame-title" class="text-base font-medium text-white mt-2">Film Negative Inspection</h3>
            </div>

            <!-- Negative frame container mockup -->
            <div class="relative bg-black p-5 rounded-xl border border-neutral-800 shadow-2xl my-2 max-w-md w-full flex flex-col items-center">
                <!-- Top sprockets -->
                <div class="w-full flex justify-between gap-1 mb-2">
                    <template id="sprocket-tpl"><div class="w-2.5 h-3.5 bg-neutral-900 rounded-sm border border-neutral-800"></div></template>
                    <div class="sprocket-row flex justify-between w-full"></div>
                </div>
                
                <!-- Main Image Preview -->
                <div class="relative aspect-[3/2] w-full bg-neutral-900 rounded border border-neutral-800 overflow-hidden group">
                    <img id="modal-image-view" src="" alt="Frame preview" class="w-full h-full object-cover">
                </div>

                <!-- Bottom sprockets -->
                <div class="w-full flex justify-between gap-1 mt-2">
                    <div class="sprocket-row flex justify-between w-full"></div>
                </div>
            </div>

            <!-- Frame Edit & Navigation Buttons -->
            <div class="flex items-center justify-between w-full mt-4 max-w-md">
                <button id="btn-modal-replace" class="flex items-center gap-2 text-xs font-medium px-3.5 py-1.5 rounded-lg bg-charcoal-700/60 hover:bg-charcoal-600 text-mint-400 border border-neutral-800 transition-all">
                    <i data-lucide="image" class="w-3.5 h-3.5"></i>
                    Replace Photo
                </button>
                <div class="flex gap-2">
                    <button id="btn-modal-prev" class="p-1.5 rounded-lg bg-charcoal-700/60 hover:bg-charcoal-600 text-neutral-200 border border-neutral-800">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-modal-next" class="p-1.5 rounded-lg bg-charcoal-700/60 hover:bg-charcoal-600 text-neutral-200 border border-neutral-800">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- MAIN SCRIPT LOGIC -->
    <script>
        // --- DEFAULT PHOTO PLACEHOLDERS ---
        const DEFAULT_PHOTOS = [
            "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80"
        ];

        const TOTAL_FRAMES = 12;
        let photos = [...DEFAULT_PHOTOS];
        let currentInspectedFrameIndex = 0;

        // Film state
        let filmPullProgress = 0.15; // 0 to 1
        let targetPullProgress = 0.15;
        let isCanisterTransparent = false;

        // Three.js Scene Variables
        let scene, camera, renderer, controls;
        let canisterGroup, filmMesh, spoolCoreMesh, outerCanisterMesh;
        let filmTextureCanvas, filmTextureContext, filmDynamicTexture;
        let frameHitBoxes = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // Audio Effects using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playMechanicalClick(frequency = 120, duration = 0.03) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // Initialize 3D Application
        window.onload = function() {
            lucide.createIcons();
            initSprocketTemplates();
            initTextureCanvas();
            initThreeJS();
            buildFilmCanister();
            updateFilmTexture();
            setupEventListeners();
            buildThumbnails();
            animate();

            // Hide hint on interaction
            window.addEventListener('pointerdown', hideHintOnce, { once: true });
            window.addEventListener('wheel', hideHintOnce, { once: true });
        };

        function hideHintOnce() {
            const hint = document.getElementById('drag-hint');
            if (hint) hint.style.opacity = '0';
        }

        // Populate Sprockets for Modal View
        function initSprocketTemplates() {
            const rows = document.querySelectorAll('.sprocket-row');
            rows.forEach(row => {
                row.innerHTML = '';
                for (let i = 0; i < 10; i++) {
                    const hole = document.createElement('div');
                    hole.className = 'w-2.5 h-3.5 bg-neutral-900 rounded-sm border border-neutral-800/80';
                    row.appendChild(hole);
                }
            });
        }

        // --- DYNAMIC FILM TEXTURE GENERATION ---
        function initTextureCanvas() {
            filmTextureCanvas = document.createElement('canvas');
            filmTextureCanvas.width = 4096;
            filmTextureCanvas.height = 512;
            filmTextureContext = filmTextureCanvas.getContext('2d');
            filmDynamicTexture = new THREE.CanvasTexture(filmTextureCanvas);
            filmDynamicTexture.wrapS = THREE.ClampToEdgeWrapping;
            filmDynamicTexture.wrapT = THREE.ClampToEdgeWrapping;
            filmDynamicTexture.minFilter = THREE.LinearFilter;
        }

        function updateFilmTexture() {
            const ctx = filmTextureContext;
            const w = filmTextureCanvas.width;
            const h = filmTextureCanvas.height;

            ctx.clearRect(0, 0, w, h);

            // Minimalist dark film base
            ctx.fillStyle = '#121214';
            ctx.fillRect(0, 0, w, h);

            const frameWidth = (w - 200) / TOTAL_FRAMES;
            const sprocketSizeW = 16;
            const sprocketSizeH = 26;

            // Render Sprocket Holes
            ctx.fillStyle = '#050505';
            for (let x = 10; x < w - 10; x += 32) {
                ctx.beginPath();
                ctx.roundRect(x, 20, sprocketSizeW, sprocketSizeH, 3);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(x, h - 20 - sprocketSizeH, sprocketSizeW, sprocketSizeH, 3);
                ctx.fill();
            }

            // Draw Photo Frames with Mint Highlights
            photos.forEach((src, idx) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = src;
                img.onload = () => {
                    renderFrameContent(idx, img);
                };
                img.onerror = () => {
                    renderFrameContent(idx, null);
                };
            });

            function renderFrameContent(idx, img) {
                const startX = 120 + idx * frameWidth;
                const frameY = 65;
                const frameH = h - 130;
                const frameW = frameWidth - 30;

                ctx.fillStyle = '#050505';
                ctx.fillRect(startX - 2, frameY - 2, frameW + 4, frameH + 4);

                if (img) {
                    ctx.drawImage(img, startX, frameY, frameW, frameH);
                } else {
                    ctx.fillStyle = '#1c1c1f';
                    ctx.fillRect(startX, frameY, frameW, frameH);
                    ctx.fillStyle = '#52525b';
                    ctx.font = '18px Courier Prime';
                    ctx.fillText(`FRAME ${idx + 1}`, startX + 30, frameY + frameH / 2);
                }

                // Minimalist Mint Typography
                ctx.fillStyle = '#98FF98';
                ctx.font = '16px Courier Prime';
                ctx.fillText(`SAFETY FILM  S-${idx + 1}`, startX + 10, 42);
                ctx.fillText(`▶ ${idx + 1}A`, startX + frameW / 2 - 15, h - 30);

                filmDynamicTexture.needsUpdate = true;
            }
        }

        // --- THREE.JS INITIALIZATION ---
        function initThreeJS() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x121214, 0.035);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 2, 11);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;

            container.appendChild(renderer.domElement);

            // Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;
            controls.minDistance = 4;
            controls.maxDistance = 20;

            // Minimal Ambient & Directional Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(6, 12, 8);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Subtle mint rim light
            const mintRimLight = new THREE.PointLight(0x98FF98, 1.2, 15);
            mintRimLight.position.set(-6, 2, -4);
            scene.add(mintRimLight);
        }

        // --- BUILD 3D FILM CANISTER AND DYNAMIC ROLL ---
        function buildFilmCanister() {
            canisterGroup = new THREE.Group();
            scene.add(canisterGroup);

            // Materials: Dark matte grey/black finish with minimal metallic accents
            const darkMetalMaterial = new THREE.MeshStandardMaterial({
                color: 0x1f1f23,
                metalness: 0.8,
                roughness: 0.3,
            });

            const mintAccentMaterial = new THREE.MeshStandardMaterial({
                color: 0x98FF98,
                metalness: 0.4,
                roughness: 0.2,
            });

            const canisterBodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x18181a,
                metalness: 0.2,
                roughness: 0.4,
                transparent: true,
                opacity: 1.0
            });

            // Outer Dark Matte Canister Cylinder
            const canisterGeo = new THREE.CylinderGeometry(1.2, 1.2, 3.8, 48);
            outerCanisterMesh = new THREE.Mesh(canisterGeo, canisterBodyMaterial);
            outerCanisterMesh.castShadow = true;
            outerCanisterMesh.receiveShadow = true;
            canisterGroup.add(outerCanisterMesh);

            // Metallic Top Cap with Mint Accent Ring
            const capGeo = new THREE.CylinderGeometry(1.28, 1.28, 0.2, 48);
            const topCap = new THREE.Mesh(capGeo, darkMetalMaterial);
            topCap.position.y = 1.95;
            canisterGroup.add(topCap);

            const ringGeo = new THREE.TorusGeometry(1.28, 0.02, 16, 48);
            const mintRing = new THREE.Mesh(ringGeo, mintAccentMaterial);
            mintRing.rotation.x = Math.PI / 2;
            mintRing.position.y = 1.85;
            canisterGroup.add(mintRing);

            // Bottom Metallic Cap
            const bottomCap = topCap.clone();
            bottomCap.position.y = -1.95;
            canisterGroup.add(bottomCap);

            // Center Spool Core
            const coreGeo = new THREE.CylinderGeometry(0.35, 0.35, 4.2, 32);
            spoolCoreMesh = new THREE.Mesh(coreGeo, darkMetalMaterial);
            canisterGroup.add(spoolCoreMesh);

            // Spool Top Knob
            const knobGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 24);
            const topKnob = new THREE.Mesh(knobGeo, darkMetalMaterial);
            topKnob.position.y = 2.2;
            canisterGroup.add(topKnob);

            // Mouth Slot
            const feltGeo = new THREE.BoxGeometry(0.18, 3.3, 0.4);
            const feltMat = new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.9 });
            const feltSlot = new THREE.Mesh(feltGeo, feltMat);
            feltSlot.position.set(1.15, 0, 0.3);
            feltSlot.rotation.y = -Math.PI / 6;
            canisterGroup.add(feltSlot);

            rebuildFilmMesh();
        }

        // Reconstruct or update film mesh geometry based on pull progress
        function rebuildFilmMesh() {
            if (filmMesh) {
                canisterGroup.remove(filmMesh);
                filmMesh.geometry.dispose();
            }

            const totalFilmLength = 22.0; // Total unrolled length
            const unrolledLength = totalFilmLength * filmPullProgress;
            const rolledLength = totalFilmLength - unrolledLength;

            // Generate Path Points for Film: Coiled inside canister + Straight pulled strip
            const points = [];
            const innerRadius = 0.45;
            const outerRadius = 1.12;

            // Spiral points inside canister (rolled up part)
            const spiralTurns = 8 * (1 - filmPullProgress);
            const numSpiralPoints = 120;

            for (let i = 0; i <= numSpiralPoints; i++) {
                const t = i / numSpiralPoints;
                const angle = t * spiralTurns * Math.PI * 2;
                const r = innerRadius + (outerRadius - innerRadius) * t;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                points.push(new THREE.Vector3(x, 0, z));
            }

            // Tangent exit point from mouth slot
            const exitPoint = new THREE.Vector3(1.2, 0, 0.3);
            points.push(exitPoint);

            // Unrolled straight line points extending outwards
            const numUnrolledPoints = 40;
            for (let i = 1; i <= numUnrolledPoints; i++) {
                const t = i / numUnrolledPoints;
                const x = exitPoint.x + t * unrolledLength;
                // Soft wave curvature for realistic film flex
                const z = exitPoint.z + Math.sin(t * Math.PI * 2.5) * 0.12;
                points.push(new THREE.Vector3(x, 0, z));
            }

            const curve = new THREE.CatmullRomCurve3(points);
            
            // Build Ribbon/Extrusion Geometry from curve
            const tubularSegments = 250;
            const filmHeight = 3.2;
            const filmGeo = new THREE.PlaneGeometry(unrolledLength + 3, filmHeight, tubularSegments, 1);

            // Deform plane along 3D path curve
            const posAttr = filmGeo.attributes.position;
            const uvs = filmGeo.attributes.uv;

            for (let i = 0; i < posAttr.count; i++) {
                const u = uvs.getX(i);
                const v = uvs.getY(i);

                const point = curve.getPointAt(u);
                const tangent = curve.getTangentAt(u);
                const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

                // Apply height displacement
                const y = (v - 0.5) * filmHeight;

                posAttr.setXYZ(i, point.x, y, point.z);
            }

            filmGeo.computeVertexNormals();

            const filmMaterial = new THREE.MeshStandardMaterial({
                map: filmDynamicTexture,
                side: THREE.DoubleSide,
                roughness: 0.2,
                metalness: 0.1,
                transparent: true,
                opacity: 0.95
            });

            filmMesh = new THREE.Mesh(filmGeo, filmMaterial);
            filmMesh.castShadow = true;
            canisterGroup.add(filmMesh);
        }

        // --- UI INTERACTION HANDLERS ---
        function setupEventListeners() {
            // Resize Event
            window.addEventListener('resize', onWindowResize);

            // Slider Pull Event
            const slider = document.getElementById('film-pull-slider');
            slider.addEventListener('input', (e) => {
                targetPullProgress = parseFloat(e.target.value) / 100;
                playMechanicalClick(180 + targetPullProgress * 100, 0.02);
            });

            // Control Buttons
            document.getElementById('btn-rewind-full').addEventListener('click', () => {
                targetPullProgress = 0.02;
                slider.value = 2;
                playMechanicalClick(90, 0.1);
            });

            document.getElementById('btn-unroll-full').addEventListener('click', () => {
                targetPullProgress = 1.0;
                slider.value = 100;
                playMechanicalClick(300, 0.1);
            });

            // Viewport reset button
            document.getElementById('btn-reset-view').addEventListener('click', () => {
                controls.reset();
                camera.position.set(0, 2, 11);
            });

            // Transparent shell toggle
            document.getElementById('btn-toggle-transparent').addEventListener('click', () => {
                isCanisterTransparent = !isCanisterTransparent;
                outerCanisterMesh.material.opacity = isCanisterTransparent ? 0.35 : 1.0;
                document.getElementById('transparent-label').innerText = isCanisterTransparent 
                    ? "Canister Shell: Translucent" 
                    : "Canister Shell: Opaque";
            });

            // Upload photos handling
            document.getElementById('btn-upload-trigger').addEventListener('click', () => {
                document.getElementById('image-upload-input').click();
            });

            document.getElementById('image-upload-input').addEventListener('change', (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                for (let i = 0; i < Math.min(files.length, TOTAL_FRAMES); i++) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        photos[i] = event.target.result;
                        updateFilmTexture();
                        buildThumbnails();
                    };
                    reader.readAsDataURL(files[i]);
                }
            });

            // Mouse wheel pulling interaction on 3D viewport
            window.addEventListener('wheel', (e) => {
                if (e.target.closest('#canvas-container')) {
                    const delta = e.deltaY * 0.0008;
                    targetPullProgress = Math.max(0.02, Math.min(1.0, targetPullProgress + delta));
                    slider.value = targetPullProgress * 100;
                    playMechanicalClick(140 + targetPullProgress * 100, 0.015);
                }
            }, { passive: true });

            // Raycasting Frame Clicks on 3D Film Strip
            window.addEventListener('pointerdown', (e) => {
                if (e.target.tagName !== 'CANVAS') return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(filmMesh);

                if (intersects.length > 0) {
                    const uv = intersects[0].uv;
                    if (uv) {
                        // Map UV to frame index
                        const frameIdx = Math.floor(uv.x * TOTAL_FRAMES);
                        if (frameIdx >= 0 && frameIdx < TOTAL_FRAMES) {
                            openInspectionModal(frameIdx);
                        }
                    }
                }
            });

            // Modal Navigation
            document.getElementById('btn-close-modal').addEventListener('click', closeModal);
            document.getElementById('btn-modal-prev').addEventListener('click', () => {
                currentInspectedFrameIndex = (currentInspectedFrameIndex - 1 + TOTAL_FRAMES) % TOTAL_FRAMES;
                updateModalContent();
            });
            document.getElementById('btn-modal-next').addEventListener('click', () => {
                currentInspectedFrameIndex = (currentInspectedFrameIndex + 1) % TOTAL_FRAMES;
                updateModalContent();
            });
            document.getElementById('btn-modal-replace').addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            photos[currentInspectedFrameIndex] = evt.target.result;
                            updateFilmTexture();
                            buildThumbnails();
                            updateModalContent();
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            });
        }

        // --- THUMBNAIL BOTTOM STRIP BUILDER ---
        function buildThumbnails() {
            const container = document.getElementById('frame-thumbnails-container');
            container.innerHTML = '';

            photos.forEach((src, idx) => {
                const thumb = document.createElement('div');
                const isActive = idx === currentInspectedFrameIndex;
                thumb.className = `flex-shrink-0 w-11 h-8 rounded border transition-all overflow-hidden relative cursor-pointer ${
                    isActive ? 'border-mint-400 opacity-100' : 'border-neutral-800 opacity-50 hover:opacity-90'
                }`;
                
                thumb.innerHTML = `
                    <img src="${src}" class="w-full h-full object-cover">
                    <span class="absolute bottom-0 right-0 bg-charcoal-900/90 text-[8px] vintage-font px-1 text-mint-400 font-medium">${idx + 1}</span>
                `;

                thumb.addEventListener('click', () => {
                    const targetProgress = Math.max(0.1, (idx + 1) / TOTAL_FRAMES);
                    targetPullProgress = targetProgress;
                    document.getElementById('film-pull-slider').value = targetProgress * 100;
                    openInspectionModal(idx);
                });

                container.appendChild(thumb);
            });
        }

        // --- INSPECTION MODAL CONTROL ---
        function openInspectionModal(index) {
            currentInspectedFrameIndex = index;
            updateModalContent();
            const modal = document.getElementById('photo-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            playMechanicalClick(220, 0.05);
        }

        function closeModal() {
            const modal = document.getElementById('photo-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function updateModalContent() {
            const frameTag = document.getElementById('modal-frame-tag');
            const imgView = document.getElementById('modal-image-view');
            
            frameTag.innerText = `FRAME #${String(currentInspectedFrameIndex + 1).padStart(2, '0')}`;
            imgView.src = photos[currentInspectedFrameIndex];
            buildThumbnails();
        }

        // --- WINDOW RESIZE ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- MAIN ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Smooth Interpolation for Film Unrolling
            if (Math.abs(filmPullProgress - targetPullProgress) > 0.001) {
                filmPullProgress += (targetPullProgress - filmPullProgress) * 0.12;
                rebuildFilmMesh();

                // Rotate inner spool core dynamically as film rolls/unrolls
                if (spoolCoreMesh) {
                    spoolCoreMesh.rotation.y = filmPullProgress * Math.PI * 16;
                }

                // Update UI Counter Label
                const frameNum = Math.min(TOTAL_FRAMES, Math.max(1, Math.ceil(filmPullProgress * TOTAL_FRAMES)));
                document.getElementById('film-counter-display').innerText = `FRAME ${String(frameNum).padStart(2, '0')} / ${TOTAL_FRAMES}`;
                document.getElementById('slider-percentage').innerText = `${Math.round(filmPullProgress * 100)}% PULLED`;
            }

            // Idle subtle rotation float
            if (canisterGroup && !controls.state == -1) {
                canisterGroup.rotation.y = Math.sin(Date.now() * 0.0005) * 0.08;
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
